<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jungle Madness Menu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #4c9a2a; /* Jungle green background */
            background-image: url('forest-background.jpg'); /* Replace with your background image */
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .menu-title {
            font-family: 'Comic Sans MS', cursive;
            color: #ff6600;
            font-size: 48px;
            text-shadow: 2px 2px #000;
            text-align: center;
            margin-top: 20px;
        }

        .menu-button {
    background-image: url('img/wood-background.png'); /* Replace with your wood PNG image */
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    border: none; /* Remove border */
    padding: 20px 0; /* Adjust padding to center text */
    font-size: 24px;
    font-weight: bold;
    color: #fff;
    text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.7);
    text-align: center;
    width: 200px; /* Set the width to match the wood background image */
    margin: 10px auto; /* Center-align the button */
    transition: transform 0.2s;
    cursor: pointer;
    position: relative; /* For positioning the pseudo-element */
}

.menu-button:hover {
    transform: scale(1.05);
}

.menu-button:hover::after {
    content: "";
    position: absolute;
    bottom: -30px; /* Adjust to position the grass image below the button */
    left: 50%; /* Center horizontally */
    transform: translateX(-50%); /* Center the image */
    width: 200px; /* Adjust width to fit your grass image */
    height: 60px; /* Adjust height to fit your grass image */
    background-image: url('img/bg-header.png'); /* Replace with your grass PNG image */
    background-size: contain;
    background-repeat: no-repeat;
}

    </style>
</head>
<body>

    <div class="menu-container">
        <div class="menu-title">Jungle Madness</div>
        <div class="d-grid gap-3 mt-4">
            <button class="menu-button">Kebun Anggrek Sememi</button>
            <button class="menu-button">Options</button>
            <button class="menu-button">Setting</button>
            <button class="menu-button">Ranking</button>
            <button class="menu-button">Shop</button>
            <button class="menu-button">Exit</button>
        </div>
    </div>
    

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
